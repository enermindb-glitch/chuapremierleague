<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — Chuka Premier League</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="nav-slot"></div>

<div class="hero" style="padding:48px 0">
  <div class="wrap">
    <div class="eyebrow">UPDATES &amp; ANNOUNCEMENTS</div>
    <h1 style="max-width:none">News</h1>
  </div>
</div>

<div class="wrap section">
  <div id="news-list" class="grid-2"></div>
</div>

<div id="footer-slot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="fixtures.js"></script>
<script src="nav.js"></script>
<script>
(async () => {
  const news = await CPL_DATA.getNews();
  const el = document.getElementById('news-list');
  if (!news.length) {
    el.className = '';
    el.innerHTML = '<div class="empty-state">No news posted yet.</div>';
    return;
  }
  el.innerHTML = news
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .map(n => `
      <div class="card">
        ${n.image ? `<img src="${n.image}" alt="" style="width:100%;border-radius:3px;margin-bottom:14px;object-fit:cover;max-height:200px">` : ''}
        <div class="mono muted" style="font-size:0.8rem">${formatDate(n.date)}</div>
        <h3>${n.title}</h3>
        <p>${n.body}</p>
      </div>
    `).join('');
})();
</script>
</body>
</html>
