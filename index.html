<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuka Premier League</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="nav-slot"></div>

<div class="hero">
  <div class="wrap">
    <div class="eyebrow">SEASON 2026 &middot; LEAGUE A &amp; LEAGUE B</div>
    <h1>Chuka Premier League</h1>
    <p class="lede">Twelve teams. Two leagues. Every fixture, result, and player record from the season, updated after every matchday.</p>
    <div class="hero-actions">
      <a href="league-a.html" class="btn btn-gold">League A Table</a>
      <a href="league-b.html" class="btn btn-outline">League B Table</a>
    </div>
  </div>
</div>

<div class="ticker">
  <div id="ticker-slot" class="ticker-inner"><span class="ticker-item loading-pulse">Loading fixtures…</span></div>
</div>

<div class="wrap section">
  <div class="grid-2">
    <div>
      <div class="section-head">
        <h2 class="mt-0">League A</h2>
        <a href="league-a.html" class="mono muted">Full table &rarr;</a>
      </div>
      <div id="standings-a"></div>
    </div>
    <div>
      <div class="section-head">
        <h2 class="mt-0">League B</h2>
        <a href="league-b.html" class="mono muted">Full table &rarr;</a>
      </div>
      <div id="standings-b"></div>
    </div>
  </div>
</div>

<div class="wrap section" style="padding-top:0">
  <div class="section-head">
    <h2 class="mt-0">Latest News</h2>
    <a href="news.html" class="mono muted">All news &rarr;</a>
  </div>
  <div id="news-preview" class="grid-3"></div>
</div>

<div id="footer-slot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="standings.js"></script>
<script src="fixtures.js"></script>
<script src="nav.js"></script>
<script>
(async () => {
  const [fixA, fixB, standA, standB, news] = await Promise.all([
    CPL_DATA.getFixtures('A'), CPL_DATA.getFixtures('B'),
    CPL_DATA.getStandings('A'), CPL_DATA.getStandings('B'),
    CPL_DATA.getNews(),
  ]);
  renderTicker(fixA, fixB, document.getElementById('ticker-slot'));
  renderStandingsTable(standA, document.getElementById('standings-a'));
  renderStandingsTable(standB, document.getElementById('standings-b'));

  const newsEl = document.getElementById('news-preview');
  newsEl.innerHTML = news.slice(0, 3).map(n => `
    <div class="card">
      <div class="mono muted" style="font-size:0.8rem">${formatDate(n.date)}</div>
      <h3>${n.title}</h3>
      <p>${(n.body || '').slice(0, 140)}${n.body && n.body.length > 140 ? '…' : ''}</p>
    </div>
  `).join('');
})();
</script>
</body>
</html>
